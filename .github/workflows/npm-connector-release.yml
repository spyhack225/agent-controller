name: npm connector release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable connector version from packages/connector/package.json (for example 0.1.0).
        required: true
        type: string
      release_tag:
        description: Exact annotated tag connector-vVERSION.
        required: true
        type: string
      target_commit_sha:
        description: Exact lowercase 40-character commit SHA referenced by the release tag.
        required: true
        type: string
      confirmation:
        description: Enter publish:@agent-controller/connector@VERSION:TAG:COMMIT exactly.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-controller-npm-connector-release
  cancel-in-progress: false

env:
  CI: "true"
  NO_COLOR: "1"
  CONNECTOR_RELEASE_NPM_VERSION: "11.5.1"

jobs:
  verify-candidate:
    name: Verify immutable connector candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out protected automation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out exact connector source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_commit_sha }}
          fetch-depth: 0
          path: release
          persist-credentials: false
      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
      - name: Pin npm trusted-publishing client
        run: npm install --global npm@${CONNECTOR_RELEASE_NPM_VERSION} --ignore-scripts --no-audit --no-fund
      - name: Resolve the exact annotated tag and default-branch commit
        working-directory: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_COMMIT: ${{ inputs.target_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_TAG" == "connector-v${RELEASE_VERSION}" ]]
          [[ "$TARGET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$TAG_COMMIT" = "$TARGET_COMMIT"
          git merge-base --is-ancestor "$TARGET_COMMIT" "origin/${DEFAULT_BRANCH}"
          printf 'NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT=%s\n' "$TARGET_COMMIT" >> "$GITHUB_ENV"
          printf 'NPM_CONNECTOR_RELEASE_TAG_COMMIT=%s\n' "$TAG_COMMIT" >> "$GITHUB_ENV"
      - name: Validate exact release authorization and package identity
        working-directory: release
        env:
          NPM_CONNECTOR_RELEASE_VERSION: ${{ inputs.version }}
          NPM_CONNECTOR_RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_CONNECTOR_RELEASE_COMMIT: ${{ inputs.target_commit_sha }}
          NPM_CONNECTOR_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT }}
          NPM_CONNECTOR_RELEASE_TAG_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_TAG_COMMIT }}
          NPM_CONNECTOR_RELEASE_AUTOMATION_COMMIT: ${{ github.sha }}
          NPM_CONNECTOR_RELEASE_DISPATCH_REF: ${{ github.ref_name }}
          NPM_CONNECTOR_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NPM_CONNECTOR_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release
        run: node ../automation/scripts/connector-npm-release.mjs validate-local
      - name: Run repository secret gate
        working-directory: release
        run: npm run security:repo
      - name: Validate maintained documentation links
        working-directory: release
        run: npm run check:docs
      - name: Test, pack, clean-install, and dry-run the dependency-free connector
        working-directory: release
        env:
          NPM_CONNECTOR_RELEASE_VERSION: ${{ inputs.version }}
          NPM_CONNECTOR_RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_CONNECTOR_RELEASE_COMMIT: ${{ inputs.target_commit_sha }}
          NPM_CONNECTOR_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT }}
          NPM_CONNECTOR_RELEASE_TAG_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_TAG_COMMIT }}
          NPM_CONNECTOR_RELEASE_AUTOMATION_COMMIT: ${{ github.sha }}
          NPM_CONNECTOR_RELEASE_DISPATCH_REF: ${{ github.ref_name }}
          NPM_CONNECTOR_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NPM_CONNECTOR_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release
          NPM_CONNECTOR_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/release/connector-release-artifacts
          NPM_CONNECTOR_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/release/connector-release-artifacts/connector-release-evidence.json
        run: node ../automation/scripts/connector-npm-release.mjs prepare
      - name: Test protected npm workflow contracts
        working-directory: automation
        run: node --test test/npmConnectorRelease.test.mjs
      - name: Upload the exact tested connector candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-connector-candidate-${{ inputs.version }}-${{ inputs.target_commit_sha }}
          path: |
            release/connector-release-artifacts/agent-controller-connector-${{ inputs.version }}.tgz
            release/connector-release-artifacts/connector-release-evidence.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish connector with npm trusted publishing
    needs: verify-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out protected automation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out exact connector source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_commit_sha }}
          fetch-depth: 0
          path: release
          persist-credentials: false
      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          registry-url: https://registry.npmjs.org
      - name: Pin npm trusted-publishing client
        run: npm install --global npm@${CONNECTOR_RELEASE_NPM_VERSION} --ignore-scripts --no-audit --no-fund
      - name: Download the tested connector candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-connector-candidate-${{ inputs.version }}-${{ inputs.target_commit_sha }}
          path: release/connector-release-artifacts
      - name: Re-resolve the exact annotated tag
        working-directory: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_COMMIT: ${{ inputs.target_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_TAG" == "connector-v${RELEASE_VERSION}" ]]
          [[ "$TARGET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$TAG_COMMIT" = "$TARGET_COMMIT"
          git merge-base --is-ancestor "$TARGET_COMMIT" "origin/${DEFAULT_BRANCH}"
          printf 'NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT=%s\n' "$TARGET_COMMIT" >> "$GITHUB_ENV"
          printf 'NPM_CONNECTOR_RELEASE_TAG_COMMIT=%s\n' "$TAG_COMMIT" >> "$GITHUB_ENV"
      - name: Revalidate the authorization and downloaded tested artifact
        working-directory: release
        env:
          NPM_CONNECTOR_RELEASE_VERSION: ${{ inputs.version }}
          NPM_CONNECTOR_RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_CONNECTOR_RELEASE_COMMIT: ${{ inputs.target_commit_sha }}
          NPM_CONNECTOR_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT }}
          NPM_CONNECTOR_RELEASE_TAG_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_TAG_COMMIT }}
          NPM_CONNECTOR_RELEASE_AUTOMATION_COMMIT: ${{ github.sha }}
          NPM_CONNECTOR_RELEASE_DISPATCH_REF: ${{ github.ref_name }}
          NPM_CONNECTOR_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NPM_CONNECTOR_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release
          NPM_CONNECTOR_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/release/connector-release-artifacts
          NPM_CONNECTOR_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/release/connector-release-artifacts/connector-release-evidence.json
        run: node ../automation/scripts/connector-npm-release.mjs verify-artifact
      - name: Refuse an immutable npm name and version that already exists
        working-directory: release
        env:
          PACKAGE_SPEC: ${{ format('@agent-controller/connector@{0}', inputs.version) }}
        run: |
          set -euo pipefail
          mkdir -p connector-release-artifacts
          set +e
          npm view "$PACKAGE_SPEC" version --json > connector-release-artifacts/existing-version.json 2> connector-release-artifacts/existing-version.error
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "That npm package version already exists and cannot be reused." >&2
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found' connector-release-artifacts/existing-version.error; then
            echo "npm registry availability could not be proven; refusing publication." >&2
            exit 1
          fi
          rm -f connector-release-artifacts/existing-version.json connector-release-artifacts/existing-version.error
      - name: Publish the exact tested tarball with OIDC provenance
        id: publish
        working-directory: release
        env:
          TARBALL_PATH: ${{ format('{0}/release/connector-release-artifacts/agent-controller-connector-{1}.tgz', github.workspace, inputs.version) }}
        run: npm publish "$TARBALL_PATH" --access public --provenance --tag latest --ignore-scripts --json > connector-release-artifacts/npm-publish.json
      - name: Record the successful immutable publication
        working-directory: release
        env:
          NPM_CONNECTOR_RELEASE_VERSION: ${{ inputs.version }}
          NPM_CONNECTOR_RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_CONNECTOR_RELEASE_COMMIT: ${{ inputs.target_commit_sha }}
          NPM_CONNECTOR_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT }}
          NPM_CONNECTOR_RELEASE_TAG_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_TAG_COMMIT }}
          NPM_CONNECTOR_RELEASE_AUTOMATION_COMMIT: ${{ github.sha }}
          NPM_CONNECTOR_RELEASE_DISPATCH_REF: ${{ github.ref_name }}
          NPM_CONNECTOR_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NPM_CONNECTOR_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release
          NPM_CONNECTOR_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/release/connector-release-artifacts
          NPM_CONNECTOR_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/release/connector-release-artifacts/connector-release-evidence.json
          NPM_CONNECTOR_RELEASE_PUBLISH_RESULT_PATH: ${{ github.workspace }}/release/connector-release-artifacts/npm-publish.json
        run: node ../automation/scripts/connector-npm-release.mjs record-publish
      - name: Upload the redacted publication checkpoint
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-connector-publication-checkpoint-${{ inputs.version }}-${{ inputs.target_commit_sha }}
          path: release/connector-release-artifacts/connector-release-evidence.json
          if-no-files-found: warn
          retention-days: 1

  verify-published:
    name: Verify published connector externally
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out protected automation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out exact connector source metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_commit_sha }}
          fetch-depth: 0
          path: release
          persist-credentials: false
      - name: Set up Node.js without registry credentials
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
      - name: Pin npm verification client
        run: npm install --global npm@${CONNECTOR_RELEASE_NPM_VERSION} --ignore-scripts --no-audit --no-fund
      - name: Download the original hash-bound candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-connector-candidate-${{ inputs.version }}-${{ inputs.target_commit_sha }}
          path: release/connector-release-artifacts
      - name: Resolve the exact release metadata without OIDC
        working-directory: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_COMMIT: ${{ inputs.target_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_TAG" == "connector-v${RELEASE_VERSION}" ]]
          [[ "$TARGET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$TAG_COMMIT" = "$TARGET_COMMIT"
          git merge-base --is-ancestor "$TARGET_COMMIT" "origin/${DEFAULT_BRANCH}"
          printf 'NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT=%s\n' "$TARGET_COMMIT" >> "$GITHUB_ENV"
          printf 'NPM_CONNECTOR_RELEASE_TAG_COMMIT=%s\n' "$TAG_COMMIT" >> "$GITHUB_ENV"
      - name: Verify the registry digest and a clean external exact-version npm exec
        working-directory: release
        env:
          PACKAGE_SPEC: ${{ format('@agent-controller/connector@{0}', inputs.version) }}
          REGISTRY_RESULT: ${{ github.workspace }}/release/connector-release-artifacts/npm-registry.json
          EXEC_RESULT: ${{ github.workspace }}/release/connector-release-artifacts/npm-exec.txt
        run: |
          set -euo pipefail
          SCRATCH=$(mktemp -d)
          CACHE=$(mktemp -d)
          trap 'rm -rf "$SCRATCH" "$CACHE"' EXIT
          VERIFIED=0
          for ATTEMPT in 1 2 3 4 5 6; do
            if npm view "$PACKAGE_SPEC" --json > "$REGISTRY_RESULT"; then
              VERIFIED=1
              break
            fi
            sleep $((ATTEMPT * 5))
          done
          test "$VERIFIED" -eq 1
          (
            cd "$SCRATCH"
            npm_config_cache="$CACHE" npm exec --yes --package="$PACKAGE_SPEC" -- agent-controller-connect update > "$EXEC_RESULT"
          )
      - name: Finalize redacted npm release evidence
        working-directory: release
        env:
          NPM_CONNECTOR_RELEASE_VERSION: ${{ inputs.version }}
          NPM_CONNECTOR_RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_CONNECTOR_RELEASE_COMMIT: ${{ inputs.target_commit_sha }}
          NPM_CONNECTOR_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_CHECKED_OUT_COMMIT }}
          NPM_CONNECTOR_RELEASE_TAG_COMMIT: ${{ env.NPM_CONNECTOR_RELEASE_TAG_COMMIT }}
          NPM_CONNECTOR_RELEASE_AUTOMATION_COMMIT: ${{ github.sha }}
          NPM_CONNECTOR_RELEASE_DISPATCH_REF: ${{ github.ref_name }}
          NPM_CONNECTOR_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NPM_CONNECTOR_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}/release
          NPM_CONNECTOR_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/release/connector-release-artifacts
          NPM_CONNECTOR_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/release/connector-release-artifacts/connector-release-evidence.json
          NPM_CONNECTOR_RELEASE_REGISTRY_RESULT_PATH: ${{ github.workspace }}/release/connector-release-artifacts/npm-registry.json
          NPM_CONNECTOR_RELEASE_EXEC_RESULT_PATH: ${{ github.workspace }}/release/connector-release-artifacts/npm-exec.txt
        run: node ../automation/scripts/connector-npm-release.mjs finalize
      - name: Upload final redacted connector release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-connector-release-${{ inputs.version }}-${{ inputs.target_commit_sha }}
          path: release/connector-release-artifacts/connector-release-evidence.json
          if-no-files-found: warn
          retention-days: 90
