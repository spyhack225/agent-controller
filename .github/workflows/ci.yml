name: Hermetic CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  repository-security:
    name: Repository integrity gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
      - name: Scan tracked repository content
        run: npm run security:repo
      - name: Validate maintained documentation links
        run: npm run check:docs

  firmware-contracts:
    name: Firmware matrix and security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
      - name: Validate firmware environments and release security
        run: npm run check:firmware-manifests
      - name: Test firmware matrix and network security contracts
        run: node --test test/firmware-build-matrix.test.mjs test/firmware-network-security.test.mjs

  frontend:
    name: Console build, typecheck, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund
      - name: Build console
        run: npm run build:app
      - name: Enforce production bundle and lazy-route budgets
        run: npm run check:frontend-performance
      - name: Typecheck console
        run: npm run typecheck:app
      - name: Test console
        run: npm run test:app

  server:
    name: Node gateway tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund
      - name: Build console
        run: npm run build:app
      - name: Typecheck durable Convex functions
        run: npm run typecheck:convex
      - name: Test gateway and local contracts
        run: npm run test:server
      - name: Test workflow, release, and staging qualification contracts
        run: npm run test:workflow

  cloud-edge:
    name: Cloudflare edge typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install locked edge dependencies
        run: npm ci --prefix cloudflare --no-audit --no-fund
      - name: Typecheck edge Worker and Durable Objects
        run: npm run typecheck:cloud
      - name: Test edge contracts, runtime, and resilience
        run: npm run test:cloud

  cloud-control-plane:
    name: Private control-plane typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare-control-plane/package-lock.json
      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked control-plane dependencies
        run: npm ci --prefix cloudflare-control-plane --no-audit --no-fund
      - name: Typecheck private Worker and Container boundary
        run: npm run typecheck:cloud-control-plane
      - name: Test private control-plane contracts
        run: npm run test:cloud-control-plane

  connector:
    name: Connector tests and package smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
      - name: Test connector lifecycle and resilience
        run: npm run test:connector
      - name: Pack and install connector tarball
        run: npm run pack:connector

  container-smoke:
    name: Private Container release smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILDKIT_PROGRESS: plain
      BUILDX_GIT_INFO: "false"
      BUILDX_GIT_LABELS: "false"
      BUILDX_GIT_CHECK_DIRTY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
      - name: Show Docker runtime
        run: docker version
      - name: Build and exercise the release image
        run: npm run test:container
